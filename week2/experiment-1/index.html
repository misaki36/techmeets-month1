<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スライドショー</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .slideshow {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      width: 600px;
    }

    .slide-window {
      position: relative;
      width: 600px;
      height: 300px;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .slide.active {
      opacity: 1;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
    }

    .btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #555;
    }

    .btn:disabled {
      background: #bbb;
      cursor: default;
    }

    .counter {
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="slideshow">
    <div class="slide-window" id="slideWindow"></div>
    <div class="controls">
      <button class="btn" id="prevBtn">&#8592; 前へ</button>
      <span class="counter" id="counter"></span>
      <button class="btn" id="nextBtn">次へ &#8594;</button>
    </div>
  </div>

  <script>
    const images = [
      'https://placehold.jp/600x300.png',
      'https://placehold.jp/3d4070/ffffff/600x300.png?text=Slide+2',
      'https://placehold.jp/70503d/ffffff/600x300.png?text=Slide+3',
      'https://placehold.jp/3d7050/ffffff/600x300.png?text=Slide+4',
      'https://placehold.jp/703d50/ffffff/600x300.png?text=Slide+5',
    ];

    let current = 0;

    const slideWindow = document.getElementById('slideWindow');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counter = document.getElementById('counter');

    images.forEach((src, i) => {
      const div = document.createElement('div');
      div.classList.add('slide');
      if (i === 0) div.classList.add('active');
      const img = document.createElement('img');
      img.src = src;
      img.alt = `スライド ${i + 1}`;
      div.appendChild(img);
      slideWindow.appendChild(div);
    });

    function update() {
      slideWindow.querySelectorAll('.slide').forEach((s, i) => {
        s.classList.toggle('active', i === current);
      });
      counter.textContent = `${current + 1} / ${images.length}`;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === images.length - 1;
    }

    prevBtn.addEventListener('click', () => { current--; update(); });
    nextBtn.addEventListener('click', () => { current++; update(); });

    update();
  </script>
</body>
</html>
